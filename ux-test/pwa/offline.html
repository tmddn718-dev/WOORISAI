<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF9F6">
<title>우리사이 · 연결 확인</title>
<style>
  :root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",sans-serif;background:#FAF9F6;color:#242622}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));text-align:center}
  main{width:min(100%,360px);display:flex;flex-direction:column;align-items:center}
  img{width:80px;height:80px;margin-bottom:24px}
  h1{margin:0;font-size:22px;line-height:1.35}
  p{margin:10px 0 24px;color:#62665F;font-size:15px;line-height:1.6;text-wrap:pretty}
  button{min-height:48px;padding:0 24px;border:0;border-radius:12px;background:#566B5C;color:#fff;font:600 16px/1 inherit;cursor:pointer}
  button:focus-visible{outline:3px solid #9FB2A3;outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>인터넷 연결을 확인해 주세요</h1>
  <p>연결이 돌아오면 우리사이 체험을 이어갈 수 있어요.</p>
  <button type="button" onclick="location.reload()">다시 시도하기</button>
</main>
</body>
</html>
