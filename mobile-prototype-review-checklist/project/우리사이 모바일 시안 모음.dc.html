<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="design_doc_mode" content="canvas">
  <link rel="stylesheet" href="_ds/woorisai-design-system-e5e56bd3-1094-469a-b2c6-d51e8ddd353c/fonts/fonts.css">
  <link rel="stylesheet" href="_ds/woorisai-design-system-e5e56bd3-1094-469a-b2c6-d51e8ddd353c/tokens/fig-tokens.css">
  <link rel="stylesheet" href="_ds/woorisai-design-system-e5e56bd3-1094-469a-b2c6-d51e8ddd353c/tokens/fig-typography.css">
  <link rel="stylesheet" href="_ds/woorisai-design-system-e5e56bd3-1094-469a-b2c6-d51e8ddd353c/tokens/ws-tokens.css">
  <link rel="stylesheet" href="_ds/woorisai-design-system-e5e56bd3-1094-469a-b2c6-d51e8ddd353c/tokens/semantic.css">
  <link rel="stylesheet" href="_ds/woorisai-design-system-e5e56bd3-1094-469a-b2c6-d51e8ddd353c/styles.css">
  <script src="_ds/woorisai-design-system-e5e56bd3-1094-469a-b2c6-d51e8ddd353c/_ds_bundle.js"></script>
  <style>
    html,body{margin:0;background:var(--ws-color-bg-surface-muted);font-family:var(--ws-font-product);-webkit-font-smoothing:antialiased}
    a{color:var(--ws-color-fg-link)}a:hover{color:var(--ws-color-bg-brand-hover)}
    *{box-sizing:border-box}
  </style>
</helmet>
<div style="padding:64px 72px 96px;display:flex;flex-direction:column;gap:72px;color:var(--ws-color-fg-default)">
  <header style="display:flex;align-items:flex-end;justify-content:space-between;gap:32px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:20px">
      <img src="brand/woorisai-symbol.svg" alt="우리사이 심볼" style="width:72px;height:72px;margin:-6px">
      <div style="display:flex;flex-direction:column;gap:6px">
        <span style="font-family:var(--ws-font-wordmark);font-weight:800;font-size:24px;color:var(--ws-color-fg-brand)">우리사이</span>
        <h1 style="margin:0;font:var(--type-title-1);color:var(--ws-color-fg-strong)">모바일 시안 모음 · 최종</h1>
        <p style="margin:0;font:var(--type-body-1-read);color:var(--ws-color-fg-secondary)">375 × 812 · 화면 {{ count }}개 · 인터랙티브 프로토타입의 실제 상태를 그대로 불러와요.</p>
      </div>
    </div>
    <a href="{{ protoHref }}" style="font:var(--type-label-1);text-decoration:none;display:flex;align-items:center;gap:4px">인터랙티브 프로토타입 열기 →</a>
  </header>

  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="5">
    <section style="display:flex;flex-direction:column;gap:28px">
      <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--ws-color-border-subtle);padding-bottom:12px">
        <span style="font:var(--type-label-1);color:var(--ws-color-fg-brand)">{{ g.key }}</span>
        <h2 style="margin:0;font:var(--type-heading-2);color:var(--ws-color-fg-strong)">{{ g.title }}</h2>
        <span style="font:var(--type-label-1);color:var(--ws-color-fg-tertiary)">{{ g.note }}</span>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:56px 48px">
        <sc-for list="{{ g.shots }}" as="s" hint-placeholder-count="3">
          <figure data-screen-label="{{ s.no }} {{ s.title }}" style="margin:0;display:flex;flex-direction:column;gap:20px;width:375px">
            <figcaption style="display:flex;flex-direction:column;gap:4px;padding:0 4px">
              <span style="display:flex;align-items:center;gap:8px">
                <span style="font:var(--type-caption-1);color:var(--ws-badge-brand-fg);background:var(--ws-badge-brand-bg);padding:2px 8px;border-radius:9999px">{{ s.no }}</span>
                <span style="font:var(--type-headline-1);color:var(--ws-color-fg-strong)">{{ s.title }}</span>
              </span>
              <span style="font:var(--type-label-2);color:var(--ws-color-fg-tertiary);text-wrap:pretty">{{ s.desc }}</span>
            </figcaption>
            <div style="width:375px;height:812px;border-radius:44px;overflow:hidden;background:var(--ws-color-bg-canvas);box-shadow:var(--ws-elevation-3), 0 0 0 10px #242622;position:relative">
              <iframe data-shot="{{ s.id }}" title="{{ s.title }}" loading="lazy" src="{{ s.src }}" style="width:375px;height:812px;border:0;display:block"></iframe>
            </div>
          </figure>
        </sc-for>
      </div>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const FILE = '우리사이 인터랙티브 프로토타입.dc.html';
const GROUPS = [
  { key: 'A', title: '첫 진입 · 비로그인', note: '예시 추억으로 둘러보기 · 행동할 때만 로그인', shots: [
    ['gHome', '둘러보기 홈', '미리보기 표시 · 예시 추억 · 이렇게 써요'],
    ['gFoot', '둘러보기 · 발자국', '예시 발자국 · 로그인하고 모으기'],
    ['gPrompt', '로그인 필요 안내', '추억 만들기를 누르면 이유와 함께 안내'],
    ['login', '로그인', '로그인 후 원래 하려던 행동으로 복귀']
  ]},
  { key: 'B', title: '홈', note: '최근 추억 · 새 추억 만들기 · 다가오는 약속', shots: [
    ['home', '활성 사용자 홈', '최근 함께한 추억 · 새 추억 CTA · 초대'],
    ['homePlan', '홈 · 다가오는 약속', '참석 상태 배지 · 변경됨 · 지난 약속 추억 연결'],
    ['newHome', '홈 · 첫 사용자', '아직 추억이 없어요 · 첫 추억 만들기']
  ]},
  { key: 'C', title: '추억 피드 · 달력', note: '피드/달력 전환 · 사람·기간·지역 필터 · 약속 통합', shots: [
    ['feed', '추억 피드', '공동 추억 24개 · 최근 순'],
    ['feedPeople', '피드 · 사람 필터', '민지와 함께한 추억만'],
    ['cal', '추억·약속 달력', '11월 8일 · 같은 날의 약속과 추억'],
    ['calPlan', '달력 · 약속만', '전체/약속/추억 필터 · 날짜별 약속']
  ]},
  { key: 'D', title: '추억 상세 · 사진 갤러리', note: '전체 사진 스와이프 · 참여자별 갤러리 · +N 제거', shots: [
    ['detail', '제주 여행 추억 상세', '2026.10.03–05 · 서귀포 · 4명 · 사진 38'],
    ['viewer', '전체 화면 사진 뷰어', '좌우 넘김 · 확대 · 닫으면 위치 유지'],
    ['contrib', '내 사진과 이야기 더하기', '기존 추억에 기여 · image-plus'],
    ['members', '참여자', '볼 수 있는 사람 · 초대 링크']
  ]},
  { key: 'E', title: '새 추억 만들기', note: '만들기 탭 · 사진 또는 이야기로 시작 · 약속에서 이어 만들기', shots: [
    ['createChoice', '새 추억 만들기 · 시작', '사진으로 / 이야기로 시작하기'],
    ['createPhoto', '사진으로 시작', '데모 앨범·기기 사진 다중 선택 · 대표 사진'],
    ['createStory', '이야기로 시작', '사진 없이도 추억 만들기'],
    ['fromPlan', '약속에서 추억 만들기', '제목·날짜·장소·사람 미리 입력 · 지역은 직접']
  ]},
  { key: 'F', title: '약속', note: '추억을 만들기 위한 보조 기능 · 상태별 CTA', shots: [
    ['planNew', '새 약속 만들기', '제목·날짜·시간 필수 · 장소·초대·메모 선택'],
    ['planPending', '초대받은 약속', '응답 전 · 참석/미정/불참 · 장소 미정'],
    ['planChanged', '일정 변경 안내', '장소 변경 사실 안내 · 참석 상태'],
    ['planHost', '내가 만든 약속', '약속 수정·취소 · 초대받은 사람 시점 전환'],
    ['planAs', '초대받은 사람 시점', '데모 · 유나로 참석 여부 변경'],
    ['planPast', '지난 약속', '이 약속을 추억으로 남기기'],
    ['planLinked', '추억이 연결된 약속', '함께한 추억 보기'],
    ['planCancel', '취소된 약속', '취소 표시 · 추억 CTA 숨김']
  ]},
  { key: 'G', title: '우리의 발자국 · 나', note: '추억에 지역을 연결한 경우에만 발자국', shots: [
    ['foot', '우리의 발자국', '8 / 17 지역 · 추억 24개'],
    ['footWith', '함께한 발자국', '사람별 공동 발자국'],
    ['region', '지역별 추억 · 서울', '이곳의 추억 · 함께한 사람'],
    ['me', '나', '추억 · 함께한 사람 · 지역 · 설정']
  ]}
];

class Component extends DCLogic {
  renderVals() {
    const base = encodeURI(FILE);
    let n = 0;
    const groups = GROUPS.map(g => ({ ...g, shots: g.shots.map(([id, title, desc]) => ({ id, title, desc, no: String(++n).padStart(2, '0'), src: base + '#shot=' + id })) }));
    return { groups, count: n, protoHref: base };
  }
}
</script>
</body>
</html>
