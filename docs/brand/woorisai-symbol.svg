<svg xmlns="http://www.w3.org/2000/svg"
     width="1024"
     height="1024"
     viewBox="0 0 120 120">

  <title>WOORISAI — Connection Knot</title>
  <desc>
    우리사이 브랜드 로고.
    두 개의 연결된 형태와 중앙의 추억을 표현한 심볼.
  </desc>

  <!-- 앱 아이콘 배경 -->
  <rect
    id="background"
    x="10"
    y="10"
    width="100"
    height="100"
    rx="26"
    fill="#566B5C"
  />

  <!-- 연결의 매듭 -->
  <path
    id="connection-knot"
    d="
      M32 44
      C32 33 44 28 53 36
      L60 43
      L67 36
      C76 28 88 33 88 44
      V77
      C88 88 76 93 67 85
      L60 78
      L53 85
      C44 93 32 88 32 77
      Z
    "
    fill="#FAF9F6"
  />

  <!-- 함께 만든 추억 -->
  <circle
    id="shared-memory"
    cx="60"
    cy="60"
    r="9"
    fill="#566B5C"
  />

</svg>
